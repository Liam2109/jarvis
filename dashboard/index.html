<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis - Mon entreprise</title>
<!-- Mise en page revue le 17/11/2026 avec le skill unslop de Damir Sokolovsky (@heydamir), CC BY 4.0 : https://github.com/heydamir/unslop -->
<style>
  :root {
    /* Neutres graphite (fond, surfaces, lignes, 3 rôles de texte) + 1 accent ocre + 2 gammes naturelles pour les voyants : ardoise (passé aujourd'hui), argile (erreur). Pas de vert, pas de violet. */
    --fond: #0F0F10; --surface: #151517; --surface-2: #1C1C1F; --ligne: rgba(237,237,237,.08); --ligne-forte: rgba(237,237,237,.14);
    --texte: #EDEDED; --doux: #A1A1A6; --faible: #85858B;
    --accent: #D6A15C; --ardoise: #8EA6B8; --argile: #CF7A62;
    --courbe: cubic-bezier(.22,1,.36,1);
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); font: 14px/20px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--texte); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  [hidden] { display: none !important; }
  .meta, .num { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--faible); font-variant-numeric: tabular-nums; }

  /* En-tête */
  header { position: sticky; top: 0; z-index: 5; background: var(--fond); border-bottom: 1px solid var(--ligne); }
  .barre { display: flex; align-items: center; gap: 16px; max-width: 1440px; margin: 0 auto; padding: 0 32px; height: 56px; }
  .marque { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .marque span { color: var(--faible); font-weight: 400; margin-left: 8px; }
  nav { display: flex; gap: 4px; margin-left: 24px; overflow-x: auto; scrollbar-width: none; }
  nav button { background: none; border: 0; border-radius: 8px; color: var(--doux); padding: 0 12px; height: 32px; cursor: pointer; white-space: nowrap; transition: color .15s var(--courbe), background-color .15s var(--courbe); }
  nav button:hover { color: var(--texte); background: var(--surface); }
  nav button[aria-selected="true"] { color: var(--texte); background: var(--surface-2); box-shadow: inset 0 -2px 0 var(--accent); }
  .outils { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  input, select { background: var(--surface); border: 1px solid var(--ligne); border-radius: 8px; height: 32px; padding: 0 12px; }
  input { width: 200px; } input::placeholder { color: var(--faible); }

  main { max-width: 1440px; margin: 0 auto; padding: 48px 32px 96px; animation: entree .4s var(--courbe) both; }
  @keyframes entree { from { opacity: 0; transform: translateY(8px); } }
  h1, h2, h3 { margin: 0; font-weight: 500; }
  .vide { color: var(--faible); }

  /* Aujourd'hui : la chaîne de vente, de l'appel au paiement */
  .tete { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .tete h1 { font-size: 32px; line-height: 40px; letter-spacing: -.01em; }
  .tete h2 { font-size: 20px; line-height: 28px; }
  .chaine { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); border-top: 1px solid var(--ligne); border-bottom: 1px solid var(--ligne); }
  .chaine li { position: relative; padding: 24px 24px 24px 0; min-height: 152px; display: flex; flex-direction: column; }
  .chaine li + li { padding-left: 24px; border-left: 1px solid var(--ligne); }
  .chaine li + li::before { content: ""; position: absolute; left: -5px; top: 30px; width: 8px; height: 8px; background: var(--fond); border-top: 1px solid var(--ligne-forte); border-right: 1px solid var(--ligne-forte); transform: rotate(45deg); }
  .chaine .lib { color: var(--doux); }
  .chaine b { font-size: 40px; line-height: 48px; font-weight: 500; font-variant-numeric: tabular-nums; margin: 12px 0 8px; letter-spacing: -.02em; }
  .chaine li.cle b { color: var(--accent); }
  .chaine b.manque { color: var(--faible); font-weight: 400; }
  .chaine .det { color: var(--faible); font-size: 13px; line-height: 18px; margin-top: auto; }
  .source { margin: 12px 0 0; }

  /* Agents : un voyant par agent, regroupés par pôle */
  .agents { margin-top: 64px; }
  .resume { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .poles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px; }
  .pole h3 { font-size: 13px; line-height: 20px; color: var(--doux); display: flex; align-items: center; justify-content: space-between; padding: 0 8px 8px; border-bottom: 1px solid var(--ligne); margin-bottom: 4px; }
  .agent { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; column-gap: 8px; width: 100%; min-height: 36px; padding: 8px; background: none; border: 0; border-radius: 8px; text-align: left; cursor: pointer; transition: background-color .15s var(--courbe); }
  .agent:hover, .agent[aria-pressed="true"] { background: var(--surface-2); }
  .agent .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .err { grid-column: 2 / 4; color: var(--argile); font-size: 12px; line-height: 16px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pt { width: 8px; height: 8px; border-radius: 50%; justify-self: center; flex: none; background: var(--ligne-forte); }
  .pt.ok { background: var(--ardoise); box-shadow: none; }
  .pt.ancien { background: none; box-shadow: inset 0 0 0 1.5px var(--ardoise); }
  .pt.erreur { background: var(--argile); box-shadow: none; }
  .legende { display: flex; gap: 16px; flex-wrap: wrap; } .legende span { display: inline-flex; align-items: center; gap: 8px; }
  .note { color: var(--faible); font-size: 13px; margin: 0 0 24px; max-width: 72ch; }

  /* Pipeline et documents */
  .tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); border-top: 1px solid var(--ligne); border-bottom: 1px solid var(--ligne); margin-bottom: 40px; }
  .tuile { padding: 20px 20px 20px 0; } .tuile + .tuile { padding-left: 20px; border-left: 1px solid var(--ligne); }
  .tuile span { color: var(--doux); } .tuile b { display: block; font-size: 28px; line-height: 36px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 8px; }
  .entonnoir { max-width: 760px; }
  .etape { display: grid; grid-template-columns: 180px 1fr 48px; align-items: center; gap: 16px; height: 36px; }
  .etape span { color: var(--doux); }
  .piste { background: var(--surface); border-radius: 4px; height: 8px; overflow: hidden; }
  .rempli { height: 100%; background: var(--ardoise); border-radius: 4px; }
  .etape b { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
  .docs { max-width: 880px; }
  details { border-bottom: 1px solid var(--ligne); }
  summary { cursor: pointer; padding: 12px 8px; border-radius: 8px; list-style: none; display: flex; gap: 12px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: ""; width: 6px; height: 6px; margin-top: 7px; flex: none; border-right: 1.5px solid var(--faible); border-bottom: 1.5px solid var(--faible); transform: rotate(-45deg); transition: transform .15s var(--courbe); }
  details[open] > summary::before { transform: rotate(45deg); }
  summary:hover { background: var(--surface); }
  .corps { color: var(--doux); padding: 4px 8px 16px 26px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  code { font-family: var(--mono); background: var(--surface-2); padding: 1px 4px; border-radius: 4px; font-size: 12px; }

  /* Panneau de détail d'un agent */
  #panneau { position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--ligne); padding: 24px; overflow-y: auto; z-index: 10; transform: translateX(100%); visibility: hidden; transition: transform .3s var(--courbe), visibility 0s .3s; }
  #panneau.ouvert { transform: none; visibility: visible; transition: transform .3s var(--courbe); }
  #panneau h2 { font-size: 20px; line-height: 28px; display: flex; align-items: center; gap: 12px; padding-right: 40px; }
  #panneau p { color: var(--doux); }
  #panneau dl { display: grid; grid-template-columns: 136px 1fr; gap: 8px 16px; margin: 24px 0; font-size: 13px; }
  #panneau dt { color: var(--faible); } #panneau dd { margin: 0; }
  .boutons { display: flex; flex-wrap: wrap; gap: 8px; }
  .bouton { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; background: var(--surface-2); border: 1px solid var(--ligne); border-radius: 8px; cursor: pointer; text-decoration: none; transition: border-color .15s var(--courbe); }
  .bouton:hover { border-color: var(--ligne-forte); }
  .fermer { position: absolute; top: 20px; right: 20px; width: 32px; padding: 0; justify-content: center; }
  .journal-agent { margin-top: 24px; font-size: 13px; }
  .journal-agent div { display: grid; grid-template-columns: 136px 1fr; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--ligne); }

  @media (max-width: 1100px) { .chaine { grid-template-columns: repeat(3, minmax(0, 1fr)); } .chaine li:nth-child(3n+1) { padding-left: 0; border-left: 0; } .chaine li:nth-child(3n+1)::before { display: none; } .chaine li:nth-child(n+4) { border-top: 1px solid var(--ligne); } }
  @media (max-width: 720px) {
    .barre { flex-wrap: wrap; height: auto; padding: 12px 16px 0; gap: 12px; }
    nav { order: 3; width: 100%; margin: 0 -4px; padding-bottom: 8px; }
    .outils { margin-left: auto; } input { width: 148px; }
    main { padding: 32px 16px 64px; }
    .tete h1 { font-size: 28px; line-height: 36px; }
    .chaine { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chaine li, .chaine li + li { padding: 20px 16px 20px 0; border-left: 0; min-height: 0; }
    .chaine li:nth-child(even) { padding-left: 16px; border-left: 1px solid var(--ligne); }
    .chaine li:nth-child(n+3) { border-top: 1px solid var(--ligne); }
    .chaine li::before { display: none; }
    .chaine b { font-size: 32px; line-height: 40px; }
    .agents { margin-top: 48px; }
    .etape { grid-template-columns: 112px 1fr 40px; gap: 8px; }
    .tuile, .tuile + .tuile { padding: 16px 0; border-left: 0; border-top: 1px solid var(--ligne); }
  }
  @media (prefers-reduced-motion: reduce) { *, main { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <div class="barre">
    <div class="marque">Jarvis<span>Mon entreprise</span></div>
    <nav role="tablist" id="onglets"></nav>
    <div class="outils"><input type="search" id="recherche" placeholder="Rechercher" aria-label="Rechercher"></div>
  </div>
</header>
<main id="contenu"></main>
<aside id="panneau" aria-label="Détail de l'agent" aria-hidden="true"></aside>
<script src="agents.js"></script>
<script src="ventes.js"></script>
<script src="docs.js"></script>
<script>
(function () {
  "use strict";
  var POLES = ["Trouver", "Vendre", "Encaisser", "Communiquer", "Autres"];
  var ONGLETS = [["jour", "Aujourd'hui"], ["pipeline", "Pipeline"], ["a_faire", "À faire"], ["journal", "Journal"], ["decisions", "Décisions"], ["idees", "Idées"]];
  var JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"], MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  var CLE = "paiements";   // le chiffre qui compte : seul à porter l'accent
  var A = null, V = null, D = null, onglet = "jour", choisi = null, pole = "";
  try { onglet = localStorage.getItem("jarvis-onglet") || "jour"; if (onglet === "org") onglet = "jour"; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\[\[(?:[^\]|]*\\?\|)?([^\]]+)\]\]/g, "$1"); }
  function q() { return $("recherche").value.trim().toLowerCase(); }
  function val(v) { return v == null ? "—" : v; }
  function aujourdhui() { return (V && V.jour) || (A && A.chiffres && A.chiffres.jour) || ""; }
  function dateLongue(j) { var d = new Date(j + "T12:00:00"); if (isNaN(d)) return "Aujourd'hui"; var s = JOURS[d.getDay()] + " " + d.getDate() + " " + MOIS[d.getMonth()]; return s.charAt(0).toUpperCase() + s.slice(1); }
  function quand(t) {   // « 07:30 » aujourd'hui, « hier 19:30 », sinon « 15 nov. »
    if (!t) return "—";
    var j = aujourdhui(), h = t.slice(11, 16), d = new Date(t.slice(0, 10) + "T12:00:00"), r = new Date(j + "T12:00:00");
    if (t.slice(0, 10) === j) return h;
    if (Math.round((r - d) / 864e5) === 1) return "hier " + h;
    return d.getDate() + " " + ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."][d.getMonth()];
  }
  function voyant(a) {
    if (a.statut === "erreur" || a.suspendu) return ["erreur", a.suspendu ? "Suspendu" : "En erreur"];
    if (a.dernier_passage && a.dernier_passage.slice(0, 10) === aujourdhui()) return ["ok", "Passé aujourd'hui"];
    if (a.dernier_passage) return ["ancien", "Dernier passage avant aujourd'hui"];
    return ["", "Aucun passage visible sur ce PC"];
  }

  function vueJour() {
    var h = '<section aria-labelledby="t-jour"><div class="tete"><h1 id="t-jour">' + esc(dateLongue(aujourdhui())) + '</h1><span class="meta">' +
      (V ? "Ventes du jour · calculées à " + esc(V.genere_le.slice(11, 16)) : "") + "</span></div>";
    if (!V) h += '<p class="vide">Pas encore de chiffres de vente : lancez l\'icône « Jarvis - Mon entreprise » (outils\\agents-json.py).</p>';
    else {
      var c = V.chiffres || [];
      h += '<ol class="chaine" style="--n:' + c.length + '">' + c.map(function (x) {
        var manque = x.valeur == null;
        return '<li class="' + (x.cle === CLE && !manque ? "cle" : "") + '"><span class="lib">' + esc(x.libelle) + "</span><b" + (manque ? ' class="manque"' : "") + ">" + val(x.valeur) +
          '</b><span class="det">' + esc(manque ? x.raison : x.detail || "") + "</span></li>";
      }).join("") + "</ol>";
    }
    h += "</section>";
    if (!A) return h + '<p class="vide">Pas encore de données sur les agents.</p>';
    var r = q(), tous = A.agents, ok = 0, err = 0;
    tous.forEach(function (a) { var v = voyant(a)[0]; if (v === "ok") ok++; if (v === "erreur") err++; });
    h += '<section class="agents" aria-labelledby="t-agents"><div class="tete"><h2 id="t-agents">Agents</h2><div class="resume"><span class="meta">' + tous.length + " agents · " + ok + (ok > 1 ? " passés" : " passé") + " aujourd'hui · " + err + " en erreur</span>" +
      '<select id="filtre" aria-label="Filtrer par pôle"><option value="">Tous les pôles</option>' + POLES.map(function (p) { return '<option' + (p === pole ? " selected" : "") + ">" + p + "</option>"; }).join("") + "</select></div></div>";
    if (A.source && A.source.indexOf("pas visible") >= 0) h += '<p class="note">Source : ' + esc(A.source) + ".</p>";
    h += '<div class="poles">';
    POLES.forEach(function (p) {
      if (pole && pole !== p) return;
      var ag = tous.filter(function (a) { return a.pole === p && (!r || (a.nom + " " + a.role).toLowerCase().indexOf(r) >= 0); });
      if (!ag.length && p === "Autres") return;
      h += '<section class="pole"><h3>' + p + '<span class="num">' + ag.length + "</span></h3>" + (ag.length ? ag.map(ligne).join("") : '<p class="vide" style="padding:8px">Aucun agent</p>') + "</section>";
    });
    return h + '</div><p class="meta legende" style="margin-top:32px"><span><i class="pt ok"></i>passé aujourd\'hui</span><span><i class="pt ancien"></i>passé avant</span><span><i class="pt"></i>aucun passage visible ici</span><span><i class="pt erreur"></i>erreur</span></p></section>';
  }
  function ligne(a) {
    var v = voyant(a), e = a.derniere_erreur;
    return '<button class="agent" data-nom="' + esc(a.nom) + '" aria-pressed="' + (a.nom === choisi) + '" title="' + esc(v[1] + " · " + a.role) + '"><i class="pt ' + v[0] + '" aria-label="' + esc(v[1]) + '"></i><span class="nom">' + esc(a.nom) +
      '</span><span class="num">' + esc(quand(a.dernier_passage)) + "</span>" + (v[0] === "erreur" && e ? '<span class="err">' + esc(e.action) + " · " + esc(quand(e.date)) + "</span>" : "") + "</button>";
  }
  function vuePipeline() {
    var c = A.chiffres, p = c.pipeline || [], max = Math.max.apply(null, p.map(function (x) { return x[1] || 0; }).concat([1]));
    var t = [["Rendez-vous à venir", c.rendez_vous_a_venir], ["E-mails envoyés au total", c.emails_envoyes_total], ["Devis en cours", c.devis_en_cours], ["Appels Sid du jour", c.appels_sid_aujourdhui]];
    return '<div class="tete"><h1>Pipeline</h1><span class="meta">' + esc(c.jour) + " · comptes seulement · « — » : pas de donnée sur ce PC</span></div>" +
      '<div class="tuiles">' + t.map(function (x) { return '<div class="tuile"><span>' + x[0] + "</span><b>" + val(x[1]) + "</b></div>"; }).join("") + "</div>" +
      '<div class="entonnoir">' + p.map(function (x) {
        return '<div class="etape"><span>' + esc(x[0]) + '</span><div class="piste"><div class="rempli" style="width:' + (x[1] ? Math.max(2, 100 * x[1] / max) : 0) + '%"></div></div><b>' + val(x[1]) + "</b></div>";
      }).join("") + "</div>";
  }
  function vueDoc(cle) {
    if (!D) return '<p class="vide">docs.js absent : lancez outils\\agents-json.py</p>';
    var r = q(), l = (D[cle] || []).filter(function (s) { return !r || (s.titre + " " + s.texte).toLowerCase().indexOf(r) >= 0; });
    var titre = ONGLETS.filter(function (o) { return o[0] === cle; })[0][1];
    return '<div class="docs"><div class="tete"><h1>' + titre + '</h1><span class="meta">' + l.length + " entrées</span></div>" +
      (l.length ? l.map(function (s) { return "<details><summary>" + md(s.titre) + '</summary><div class="corps">' + (md(s.texte) || '<span class="vide">(vide)</span>') + "</div></details>"; }).join("") : '<p class="vide">Rien ne correspond</p>') + "</div>";
  }

  function panneau(nom) {
    choisi = nom; var a = A && A.agents.filter(function (x) { return x.nom === nom; })[0], p = $("panneau");
    if (!a) { p.classList.remove("ouvert"); p.setAttribute("aria-hidden", "true"); return; }
    var v = voyant(a), e = a.derniere_erreur ? esc(a.derniere_erreur.action) + " · " + esc(a.derniere_erreur.date) : "aucune", c = a.chiffre_du_jour || {};
    p.innerHTML = '<button class="bouton fermer" id="fermer" aria-label="Fermer"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>' +
      '<h2><i class="pt ' + v[0] + '"></i>' + esc(a.nom) + '</h2><div class="meta" style="margin-top:4px">' + esc(a.pole) + " · " + esc(v[1]) + "</div><p>" + esc(a.role) + "</p>" +
      "<dl><dt>Responsable</dt><dd>" + esc(a.responsable || "—") + "</dd><dt>Horaires</dt><dd>" + esc(a.horaire) + "</dd><dt>Machine</dt><dd>" + esc(a.machine) + "</dd><dt>Sur ce PC</dt><dd>" + (a.tourne_sur_ce_pc ? "tourne" : "ne tourne pas") + (a.planifie_sur_ce_pc ? ", planifié" : "") +
      "</dd><dt>Dernier passage</dt><dd>" + esc(a.dernier_passage || "aucun ici") + "</dd><dt>Dernier résultat</dt><dd>" + esc(a.dernier_resultat || "—") + "</dd><dt>Dernière erreur</dt><dd>" + e + "</dd><dt>" + esc(c.libelle || "Chiffre du jour") + "</dt><dd>" + val(c.valeur) + "</dd></dl>" +
      '<div class="boutons">' + (a.note_obsidian ? '<a class="bouton" href="' + esc(a.note_obsidian) + '">Ouvrir sa note</a>' : "") + '<button class="bouton" id="voir-journal">Voir son journal</button></div><div class="journal-agent" id="journal-agent" hidden>' +
      ((a.journal || []).slice().reverse().map(function (l) { return '<div><span class="num">' + esc(l[0]) + "</span>" + esc(l[1]) + "</div>"; }).join("") || '<p class="vide">Aucune ligne de journal sur ce PC</p>') + "</div>";
    p.classList.add("ouvert"); p.setAttribute("aria-hidden", "false");
    $("fermer").onclick = function () { panneau(null); rendre(); };
    $("voir-journal").onclick = function () { $("journal-agent").hidden = !$("journal-agent").hidden; };
  }

  function rendre() {
    $("onglets").innerHTML = ONGLETS.map(function (o) { return '<button role="tab" data-o="' + o[0] + '" aria-selected="' + (o[0] === onglet) + '">' + o[1] + "</button>"; }).join("");
    if (!ONGLETS.some(function (o) { return o[0] === onglet; })) onglet = "jour";
    $("contenu").innerHTML = onglet === "jour" ? vueJour() : onglet === "pipeline" ? (A ? vuePipeline() : '<p class="vide">Pas encore de données</p>') : vueDoc(onglet);
    var f = $("filtre"); if (f) f.onchange = function () { pole = f.value; rendre(); };
  }
  function appliquer() {
    A = window.JARVIS_AGENTS || null; V = window.JARVIS_VENTES || null; D = window.JARVIS_DOCS || null;
    rendre(); if (choisi) panneau(choisi);
  }
  $("onglets").addEventListener("click", function (e) { var b = e.target.closest("[data-o]"); if (!b) return; onglet = b.dataset.o; try { localStorage.setItem("jarvis-onglet", onglet); } catch (x) {} rendre(); });
  $("contenu").addEventListener("click", function (e) { var c = e.target.closest(".agent"); if (c) { panneau(c.dataset.nom); rendre(); } });
  $("recherche").addEventListener("input", rendre);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && choisi) { panneau(null); rendre(); } });
  function recharger() {   // toutes les 5 min : relit agents.js, ventes.js et docs.js (réécrits par outils\agents-json.py)
    var f = ["agents.js", "ventes.js", "docs.js"], n = 0;
    f.forEach(function (x) {
      var s = document.createElement("script"); s.src = x + "?t=" + Date.now();
      s.onload = s.onerror = function () { s.remove(); if (++n === f.length) appliquer(); };
      document.body.appendChild(s);
    });
  }
  appliquer(); setInterval(recharger, 5 * 60 * 1000);
})();
