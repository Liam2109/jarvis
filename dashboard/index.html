<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Jarvis - Mon entreprise</title>
<!-- Mise en page revue le 17/11/2026 avec le skill unslop de Damir Sokolovsky (@heydamir), CC BY 4.0 : https://github.com/heydamir/unslop -->
<style>
  :root {
    /* Trois gammes seulement : bleus (ciel, carte vedette, pastilles, voyants), blancs / gris bleutés (verre, texte bleu nuit), ocre foncé (paiements). Pas de vert, pas de violet, pas de rouge. */
    --ciel-haut: #E8EFFA; --ciel-bas: #F7FAFE;
    --verre: rgba(255,255,255,.45); --verre-fort: rgba(255,255,255,.8); --bord-verre: rgba(255,255,255,.7);
    --ligne: rgba(23,36,67,.08); --ligne-forte: rgba(23,36,67,.16);
    --texte: #172443; --doux: #33425E; --faible: #46546F;
    --nuit: #172443; --bleu: #2F64A8; --bleu-moyen: #2C5C9C; --bleu-clair: #9DC0EE; --bleu-pale: #DCE7F6;
    --ocre: #9A6623;
    --ombre: 0 1px 2px rgba(47,100,168,.05), 0 12px 32px rgba(47,100,168,.08);
    --courbe: cubic-bezier(.22,1,.36,1);
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { background: linear-gradient(180deg, var(--ciel-haut) 0%, var(--ciel-bas) 60%) fixed var(--ciel-bas); }
  body { margin: 0; min-height: 100vh; color: var(--texte); font: 14px/20px "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background: transparent; }
  /* Trois grandes formes floues, fixes, en CSS pur (dégradés radiaux, aucun filtre ni animation) */
  .formes { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .formes i { position: absolute; border-radius: 50%; filter: blur(80px); }
  .formes i:nth-child(1) { width: 560px; height: 560px; top: -120px; right: 4%; background: #5B8FD6; opacity: .6; }      /* bleu moyen, en haut à droite */
  .formes i:nth-child(2) { width: 480px; height: 480px; top: 38%; left: -80px; background: #86BDF2; opacity: .65; }   /* bleu ciel, au milieu à gauche */
  .formes i:nth-child(3) { width: 520px; height: 520px; bottom: -140px; right: 14%; background: #9ADBF0; opacity: .55; } /* bleu-cyan clair, en bas à droite */
  a { color: var(--bleu); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; border-radius: 8px; }
  [hidden] { display: none !important; }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  .meta, .num { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--faible); font-variant-numeric: tabular-nums; }
  .vide { color: var(--faible); }
  .verre { background: var(--verre); -webkit-backdrop-filter: blur(24px) saturate(1.2); backdrop-filter: blur(24px) saturate(1.2); border: 1px solid var(--bord-verre); border-radius: 24px; box-shadow: var(--ombre); }
  .carte { transition: transform .2s var(--courbe), box-shadow .2s var(--courbe); }
  .carte:hover { transform: translateY(-4px); box-shadow: 0 1px 2px rgba(47,100,168,.05), 0 16px 40px rgba(47,100,168,.12); }

  /* Coquille : barre latérale en verre, étroite, flottante */
  .cote { position: fixed; top: 16px; left: 16px; width: 200px; z-index: 5; display: flex; flex-direction: column; padding: 24px 12px 20px; }
  .marque { padding: 0 12px 28px; } .marque b { display: block; font-size: 16px; line-height: 24px; font-weight: 600; } .marque span { color: var(--faible); }
  .cote nav { display: flex; flex-direction: column; gap: 4px; }
  .cote nav button { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: none; color: var(--doux); cursor: pointer; text-align: left; transition: background-color .2s var(--courbe), color .2s var(--courbe); }
  .cote nav button svg { flex: none; }
  .cote nav button:hover { background: rgba(255,255,255,.7); color: var(--texte); }
  .cote nav button[aria-current="page"] { background: var(--bleu); color: #fff; font-weight: 500; }
  .cote .pied { margin: 32px 0 0; padding: 0 12px; }

  main { margin-left: 216px; padding: 40px 32px 96px 32px; min-width: 0; animation: entree .4s var(--courbe) both; }
  @keyframes entree { from { opacity: 0; transform: translateY(6px); } }
  .tete { display: flex; align-items: baseline; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .tete h1 { font-size: 30px; line-height: 38px; letter-spacing: -.01em; }
  .tete .droite { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .tete h2 { font-size: 18px; line-height: 24px; }
  input[type=search] { height: 40px; width: 240px; padding: 0 16px; border: 1px solid var(--bord-verre); border-radius: 20px; background: var(--verre-fort); }
  input::placeholder { color: var(--faible); }

  /* Carte vedette : appels notés par Sid aujourd'hui */
  .vedette { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; min-height: 232px; padding: 28px 32px; border-radius: 24px; color: #fff; overflow: hidden;
    background: linear-gradient(135deg, var(--nuit) 0%, #1F3A6A 55%, var(--bleu-moyen) 100%); box-shadow: 0 16px 40px rgba(23,36,67,.18); isolation: isolate; }
  .vedette::after { content: ""; position: absolute; z-index: -1; right: -80px; top: -60px; width: 560px; height: 380px; border-radius: 50%; background: #8FC1F2; opacity: .45; filter: blur(70px); }
  .vedette .droite-v { display: flex; flex-direction: column; align-items: flex-end; gap: 16px; }
  .repartition { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 520px; margin: 0; padding: 0; list-style: none; }
  .repartition li { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: 16px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.24); font-size: 14px; line-height: 20px; }
  .repartition b { font-size: 14px; line-height: 20px; margin: 0; letter-spacing: 0; }
  .vedette .haut { position: absolute; top: 28px; left: 32px; right: 32px; display: flex; justify-content: space-between; gap: 16px; color: rgba(255,255,255,.78); }
  .vedette .lib { display: block; color: rgba(255,255,255,.9); font-size: 16px; line-height: 24px; }
  .vedette b { display: block; font-size: 80px; line-height: 88px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 4px 0 4px; }
  .vedette b.manque { font-weight: 400; color: rgba(255,255,255,.7); }
  .vedette .det { color: rgba(255,255,255,.82); font-size: 15px; line-height: 22px; }
  .vedette svg { flex: none; }
  .vedette .meta { color: rgba(255,255,255,.72); }

  /* Les autres chiffres du jour : cartes en verre */
  .chiffres { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 24px; margin: 24px 0 0; padding: 0; list-style: none; }
  .chiffre { display: flex; flex-direction: column; min-height: 200px; padding: 24px; }
  .pastille { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--bleu-pale); color: var(--bleu); }
  .chiffre b { font-size: 44px; line-height: 52px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 20px 0 4px; }
  .chiffre b.manque { color: var(--faible); font-weight: 400; }
  .chiffre .lib { color: var(--doux); font-size: 15px; line-height: 22px; }
  .chiffre .det { margin-top: auto; padding-top: 12px; color: var(--faible); font-size: 14px; line-height: 20px; }
  .chiffre.cle b:not(.manque) { color: var(--ocre); }
  .chiffre.cle .pastille { background: #F3E6D3; color: var(--ocre); }
  .accueil-vide { padding: 32px; max-width: 720px; } .accueil-vide p { margin: 8px 0 0; color: var(--doux); }

  /* Agents : une grande carte, une colonne par pôle */
  .bloc { padding: 24px; margin-top: 24px; }
  .bloc .tete { margin-bottom: 16px; }
  .colonnes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: start; }
  .colonne { padding: 12px 8px 8px; border-radius: 16px; background: rgba(255,255,255,.5); border: 1px solid var(--bord-verre); }
  .colonne h3 { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; line-height: 22px; font-weight: 600; padding: 4px 8px 10px; border-bottom: 1px solid var(--ligne); margin-bottom: 4px; }
  .lien { border: 0; background: none; padding: 0; color: var(--bleu); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* Voyants : bleu plein = passé aujourd'hui, anneau bleu = passé avant, gris bleuté = aucun passage visible, losange bleu nuit = erreur */
  .pt { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; background: rgba(23,36,67,.28); }
  .pt.ok { background: var(--bleu); }
  .pt.ancien { background: none; box-shadow: inset 0 0 0 2px var(--bleu); }
  .pt.erreur { width: 9px; height: 9px; background: var(--texte); border-radius: 1px; transform: rotate(45deg); }
  .legende { display: flex; gap: 8px 20px; flex-wrap: wrap; margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--ligne); } .legende span { display: inline-flex; align-items: center; gap: 8px; }

  .poles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; align-items: start; }
  .pole { padding: 20px 16px 16px; }
  .pole h2 { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; line-height: 24px; padding: 0 8px 8px; }
  .agent { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; column-gap: 10px; width: 100%; min-height: 44px; font-size: 15px; padding: 8px; border: 0; border-radius: 12px; background: none; text-align: left; cursor: pointer; transition: background-color .2s var(--courbe); }
  .agent .pt { justify-self: center; }
  .agent:hover, .agent[aria-pressed="true"] { background: rgba(255,255,255,.8); }
  .agent .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .err { grid-column: 2 / 4; color: var(--texte); font-size: 12px; line-height: 16px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { color: var(--faible); font-size: 13px; margin: -8px 0 24px; max-width: 80ch; }

  /* Documents (et pipeline) */
  .sous { display: flex; gap: 4px; margin-bottom: 24px; overflow-x: auto; scrollbar-width: none; }
  .sous button { height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: none; color: var(--doux); cursor: pointer; white-space: nowrap; transition: background-color .2s var(--courbe), color .2s var(--courbe); }
  .sous button:hover { background: rgba(255,255,255,.7); }
  .sous button[aria-selected="true"] { background: var(--bleu); color: #fff; font-weight: 500; }
  .docs { padding: 12px 16px; max-width: 960px; }
  details + details { border-top: 1px solid var(--ligne); }
  summary { cursor: pointer; padding: 12px 8px; border-radius: 12px; list-style: none; display: flex; gap: 12px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: ""; width: 6px; height: 6px; margin-top: 7px; flex: none; border-right: 1.5px solid var(--faible); border-bottom: 1.5px solid var(--faible); transform: rotate(-45deg); transition: transform .2s var(--courbe); }
  details[open] > summary::before { transform: rotate(45deg); }
  summary:hover { background: rgba(255,255,255,.6); }
  .corps { color: var(--doux); padding: 4px 8px 16px 26px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  code { font-family: var(--mono); background: var(--bleu-pale); padding: 1px 4px; border-radius: 4px; font-size: 12px; }
  .pipeline { padding: 24px; max-width: 960px; }
  .source-l { display: grid; grid-template-columns: 220px 48px 1fr; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--ligne); } .source-l span:last-child { color: var(--doux); overflow-wrap: anywhere; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; padding-bottom: 24px; margin-bottom: 16px; border-bottom: 1px solid var(--ligne); }
  .stats span { display: block; color: var(--faible); font-size: 13px; line-height: 18px; } .stats b { display: block; margin-top: 4px; font-size: 28px; line-height: 36px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .etape { display: grid; grid-template-columns: 168px 1fr 40px; align-items: center; gap: 16px; min-height: 36px; }
  .etape span { color: var(--doux); }
  .piste { background: var(--bleu-pale); border-radius: 4px; height: 8px; overflow: hidden; }
  .rempli { height: 100%; background: var(--bleu); border-radius: 4px; }
  .etape b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Panneau de détail d'un agent */
  #panneau { position: fixed; top: 16px; right: 16px; bottom: 16px; width: min(440px, calc(100% - 32px)); padding: 24px; overflow-y: auto; z-index: 10; background: rgba(255,255,255,.9); transform: translateX(calc(100% + 32px)); visibility: hidden; transition: transform .3s var(--courbe), visibility 0s .3s; }
  #panneau.ouvert { transform: none; visibility: visible; transition: transform .3s var(--courbe); }
  #panneau h2 { font-size: 20px; line-height: 28px; display: flex; align-items: center; gap: 12px; padding-right: 40px; }
  #panneau p { color: var(--doux); }
  #panneau dl { display: grid; grid-template-columns: 136px 1fr; gap: 8px 16px; margin: 24px 0; font-size: 13px; }
  #panneau dt { color: var(--faible); } #panneau dd { margin: 0; overflow-wrap: anywhere; }
  .boutons { display: flex; flex-wrap: wrap; gap: 8px; }
  .bouton { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; background: #fff; border: 1px solid var(--ligne-forte); border-radius: 18px; color: var(--texte); cursor: pointer; text-decoration: none; transition: border-color .2s var(--courbe); }
  .bouton:hover { border-color: var(--bleu-clair); }
  .fermer { position: absolute; top: 20px; right: 20px; width: 36px; padding: 0; justify-content: center; }
  .journal-agent { margin-top: 24px; font-size: 13px; }
  .journal-agent div { display: grid; grid-template-columns: 136px 1fr; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--ligne); }

  .chiffre .indic { color: var(--faible); font-size: 12px; line-height: 16px; margin-top: 4px; }

  /* Statistiques (18/11) : un graphique principal (barres), puis trois blocs plus petits ; grille discrète, libellés mono, un accent par graphique, ocre seulement pour les paiements */
  .choix { display: inline-flex; gap: 4px; padding: 4px; border-radius: 20px; background: var(--verre-fort); border: 1px solid var(--bord-verre); }
  .choix button { height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: none; color: var(--doux); cursor: pointer; transition: background-color .2s var(--courbe), color .2s var(--courbe); }
  .choix button[aria-pressed="true"] { background: var(--bleu); color: #fff; font-weight: 500; }
  .stat-ligne { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; margin: 0; padding: 0; list-style: none; }
  .stat-ligne li { padding: 20px 24px; display: flex; flex-direction: column; }
  .stat-ligne span { color: var(--doux); } .stat-ligne b { font-size: 36px; line-height: 44px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 8px 0 0; }
  .stat-ligne b.manque { color: var(--faible); font-weight: 400; } .stat-ligne small { color: var(--faible); font-size: 12px; line-height: 16px; margin-top: 4px; }
  .principal { padding: 24px; margin-top: 24px; }
  .principal h2, .petit h2 { font-size: 16px; line-height: 24px; } .principal .tete, .petit .tete { margin-bottom: 12px; }
  .trois { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 24px; align-items: start; }
  .petit { padding: 24px; min-width: 0; }
  .graphe { width: 100%; min-height: 40px; } .graphe svg { display: block; overflow: visible; }
  .graphe text { font-family: var(--mono); font-size: 11px; fill: var(--faible); }
  .graphe [data-bulle] { cursor: default; } .graphe [data-bulle]:focus { outline: none; } .graphe [data-bulle]:focus-visible { stroke: var(--texte); stroke-width: 1.5; }
  .part { display: grid; grid-template-columns: 136px minmax(0, 1fr) 48px; gap: 12px; align-items: center; min-height: 32px; }
  .part span { color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .part b { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
  .part svg { display: block; }
  .taux { padding: 0 0 0 4px; margin: 0 0 2px; color: var(--faible); font-family: var(--mono); font-size: 12px; line-height: 16px; }
  .phrase-histo { color: var(--doux); margin: -8px 0 24px; max-width: 90ch; }
  #bulle { position: fixed; z-index: 20; pointer-events: none; padding: 6px 10px; border-radius: 10px; background: var(--nuit); color: #fff; font-size: 13px; line-height: 18px; white-space: nowrap; box-shadow: 0 8px 24px rgba(23,36,67,.2); opacity: 0; transition: opacity .12s var(--courbe); }
  #bulle.vu { opacity: 1; }

  /* Agents : une ligne par agent (ce qu'il fait, heure prévue, dernier passage, état) */
  .table-ag { padding: 8px 16px 12px; margin-bottom: 24px; }
  .table-ag h2 { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; line-height: 24px; padding: 12px 8px 8px; }
  .rang { display: grid; grid-template-columns: 16px minmax(0, 1fr) 168px 120px 112px; column-gap: 16px; align-items: center; width: 100%; min-height: 56px; padding: 10px 8px; border: 0; border-top: 1px solid var(--ligne); border-radius: 0; background: none; text-align: left; cursor: pointer; transition: background-color .2s var(--courbe); }
  .rang:hover, .rang[aria-pressed="true"] { background: rgba(255,255,255,.7); }
  .rang.entete { min-height: 32px; cursor: default; padding-top: 4px; padding-bottom: 4px; border-top: 0; } .rang.entete:hover { background: none; }
  .rang .pt { justify-self: center; }
  .rang .qui b { display: block; font-weight: 500; } .rang .qui span { display: block; color: var(--faible); font-size: 13px; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .etat { font-size: 13px; } .etat.place { color: var(--bleu); font-weight: 500; } .etat.desactive { color: var(--faible); } .etat.construire { color: var(--doux); text-decoration: underline dotted; text-underline-offset: 3px; }
  .lien-fichier { display: inline-flex; margin: 0 0 16px; }

  @media (max-width: 1180px) { .chiffres { grid-template-columns: repeat(2, minmax(0, 1fr)); } .chiffre:last-child:nth-child(odd) { grid-column: span 2; } .trois { grid-template-columns: 1fr 1fr; } .stat-ligne { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) {
    /* La barre latérale devient une barre du bas */
    .cote { top: auto; left: 12px; right: 12px; bottom: 12px; width: auto; padding: 6px; flex-direction: row; }
    .marque, .cote .pied { display: none; }
    .cote.verre { background: rgba(255,255,255,.88); }
    .vedette::after { width: 280px; height: 220px; right: -60px; top: -40px; opacity: .3; filter: blur(60px); }
    .cote nav { flex-direction: row; width: 100%; }
    .cote nav button { flex: 1; flex-direction: column; justify-content: center; gap: 2px; height: 52px; padding: 0 4px; font-size: 12px; line-height: 16px; border-radius: 18px; }
    main { margin-left: 0; padding: 24px 16px 112px; }
    .tete h1 { font-size: 26px; line-height: 34px; }
    .tete .droite { margin-left: 0; width: 100%; } input[type=search] { width: 100%; }
    .vedette { flex-direction: column; align-items: flex-start; min-height: 0; padding: 24px 20px; }
    .vedette .haut { position: static; margin-bottom: 24px; flex-direction: column; gap: 4px; }
    .vedette b { font-size: 64px; line-height: 72px; } .vedette .droite-v { align-items: flex-start; } .repartition { justify-content: flex-start; }
    .chiffres { gap: 16px; margin-top: 16px; }
    .chiffre { min-height: 0; padding: 20px 16px; }
    .chiffre b { font-size: 36px; line-height: 44px; margin-top: 16px; }
    .bloc { padding: 20px 16px; margin-top: 16px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .pipeline { padding: 20px 16px; }
    .etape { grid-template-columns: 136px 1fr 32px; gap: 8px; }
    .poles { grid-template-columns: 1fr; gap: 16px; }
    .source-l { grid-template-columns: 1fr 40px; } .source-l span:last-child { grid-column: 1 / 3; }
    #panneau { bottom: 88px; }
    .trois { grid-template-columns: 1fr; gap: 16px; margin-top: 16px; } .principal, .petit { padding: 20px 16px; } .principal { margin-top: 16px; }
    .stat-ligne { gap: 16px; } .stat-ligne li { padding: 16px; } .stat-ligne b { font-size: 28px; line-height: 36px; }
    .part { grid-template-columns: 112px minmax(0, 1fr) 44px; gap: 8px; }
    .table-ag { padding: 4px 8px 8px; }
    .rang { grid-template-columns: 16px minmax(0, 1fr) auto; row-gap: 2px; } .rang.entete { display: none; }
    .rang .prevu { grid-column: 2; color: var(--faible); font-size: 12px; } .rang .passe { grid-column: 3; grid-row: 1; justify-self: end; } .rang .etat { grid-column: 3; grid-row: 2; justify-self: end; }
  }
  @media (hover: none) { .carte:hover { transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, main { transition: none !important; animation: none !important; } .carte:hover { transform: none; } }
</style>
</head>
<body>

      pts.forEach(function (x, i) {
        var cx = g.l + slot * (i + .5), lib = jourCourt(x.date), auj = x.date === aujourdhui();
        if (i % pas === 0 || i === pts.length - 1) s += '<text x="' + cx.toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle">' + lib + "</text>";
        var bulle = esc(dateLongue(x.date) + " · " + x[k] + (barres ? " appel" + (x[k] > 1 ? "s" : "") + " noté" + (x[k] > 1 ? "s" : "") : " lead" + (x[k] > 1 ? "s" : "") + " chaud" + (x[k] > 1 ? "s" : "")) + (auj ? " (en cours)" : ""));
        if (barres) {
          var bw = Math.min(48, slot * .6), top = y(x[k]);
          s += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0, h - g.b - top).toFixed(1) + '" rx="4" fill="' + (auj ? "var(--bleu)" : "var(--bleu-clair)") + '"/>' +
            '<rect x="' + (cx - slot / 2).toFixed(1) + '" y="' + g.t + '" width="' + slot.toFixed(1) + '" height="' + (h - g.b - g.t) + '" fill="transparent" data-bulle="' + bulle + '" tabindex="0"/>';
        } else s += '<circle cx="' + cx.toFixed(1) + '" cy="' + y(x[k]).toFixed(1) + '" r="3.5" fill="#fff" stroke="var(--bleu)" stroke-width="2"/><circle cx="' + cx.toFixed(1) + '" cy="' + y(x[k]).toFixed(1) + '" r="14" fill="transparent" data-bulle="' + bulle + '" tabindex="0"/>';
      });
      if (!barres && pts.length > 1) s = s.replace(/(<circle)/, '<polyline points="' + pts.map(function (x, i) { return (g.l + slot * (i + .5)).toFixed(1) + "," + y(x[k]).toFixed(1); }).join(" ") + '" fill="none" stroke="var(--bleu)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>$1');
      el.innerHTML = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="' + (barres ? "Appels notés" : "Leads chauds") + " par jour, " + pts.length + ' jours">' + s + "</svg>";
    });
  }
  function bulle(cible, x, y) {
    var b = $("bulle"); if (!cible) { b.classList.remove("vu"); return; }
    b.textContent = cible.getAttribute("data-bulle"); b.classList.add("vu");
    if (x == null) { var r = cible.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top; }
    b.style.left = Math.max(8, Math.min(window.innerWidth - b.offsetWidth - 8, x - b.offsetWidth / 2)) + "px"; b.style.top = Math.max(8, y - b.offsetHeight - 12) + "px";
  }
  document.addEventListener("mousemove", function (e) { var c = e.target.closest && e.target.closest("[data-bulle]"); bulle(c, e.clientX, e.clientY); });
  document.addEventListener("focusin", function (e) { var c = e.target.closest && e.target.closest("[data-bulle]"); bulle(c); });
  document.addEventListener("focusout", function () { bulle(null); });
  window.addEventListener("scroll", function () { bulle(null); }, { passive: true });
  var tr; window.addEventListener("resize", function () { clearTimeout(tr); tr = setTimeout(function () { if (vue === "stats") graphes(); }, 150); });
  function ligne(a) {
    var v = voyant(a), e = a.derniere_erreur;
    return '<button class="agent" data-nom="' + esc(a.nom) + '" aria-pressed="' + (a.nom === choisi) + '" title="' + esc(v[1] + " · " + a.role) + '"><i class="pt ' + v[0] + '" aria-label="' + esc(v[1]) + '"></i><span class="nom">' + esc(a.nom) +
      '</span><span class="num">' + esc(quand(a.dernier_passage)) + "</span>" + (v[0] === "erreur" && e ? '<span class="err">Erreur : ' + esc(e.action) + " · " + esc(quand(e.date)) + "</span>" : "") + "</button>";
  }
  function vuePipeline() {
    if (!A) return '<p class="vide">Pas encore de données : double-cliquez sur l\'icône du bureau.</p>';
    var c = A.chiffres || {}, p = c.pipeline || [], max = Math.max.apply(null, p.map(function (x) { return x[1] || 0; }).concat([1]));
    var t = [["Rendez-vous à venir", c.rendez_vous_a_venir], ["E-mails envoyés", c.emails_envoyes_total], ["Devis en cours", c.devis_en_cours], ["Appels Sid du jour", c.appels_sid_aujourdhui]];
    return '<section class="pipeline verre"><div class="stats">' + t.map(function (x) { return "<div><span>" + x[0] + "</span><b>" + esc(val(x[1])) + "</b></div>"; }).join("") + "</div>" +
      p.map(function (x) { return '<div class="etape"><span>' + esc(x[0]) + '</span><div class="piste"><div class="rempli" style="width:' + (x[1] ? Math.max(2, 100 * x[1] / max) : 0) + '%"></div></div><b>' + esc(val(x[1])) + "</b></div>"; }).join("") +
      '<p class="meta" style="margin:16px 0 0">Comptes seulement · « — » : pas de donnée sur ce PC</p></section>';
  }
  function vueSources() {   // d'où vient chaque chiffre du jour, avec la raison technique quand il manque
    var c = V && V.chiffres || [];
    if (!c.length) return '<p class="vide">ventes.js absent : double-cliquez sur l\'icône « Jarvis - Mon entreprise » du bureau.</p>';
    return '<section class="pipeline verre">' + c.map(function (x) { return '<div class="source-l"><b>' + esc(x.libelle) + '</b><span class="num">' + esc(val(x.valeur)) + "</span><span>" + esc(x.valeur == null ? x.raison : x.detail || "") + "</span></div>"; }).join("") +
      '<p class="meta" style="margin:16px 0 0">Calculé le ' + esc(V.genere_le) + " par outils\\agents-json.py</p></section>";
  }
  function vueDocs() {
    var h = '<div class="tete"><h1>Documents</h1>' + (doc === "pipeline" ? "" : '<span class="droite"><input type="search" id="recherche" placeholder="Rechercher" aria-label="Rechercher dans les documents" value="' + esc(recherche) + '"></span>') + "</div>" +
      '<div class="sous" role="tablist">' + DOCS.map(function (d) { return '<button role="tab" data-doc="' + d[0] + '" aria-selected="' + (d[0] === doc) + '">' + d[1] + "</button>"; }).join("") + "</div>";
    if (doc === "pipeline") return h + vuePipeline();
    if (doc === "sources") return h + vueSources();
    if (!D) return h + '<p class="vide">docs.js absent : double-cliquez sur l\'icône « Jarvis - Mon entreprise » du bureau.</p>';
    if (FICHIERS[doc]) h += '<a class="bouton lien-fichier" href="' + FICHIERS[doc] + '" target="_blank" rel="noopener">Ouvrir le fichier (lecture seule)</a>';
    var r = recherche.toLowerCase(), l = (D[doc] || []).filter(function (s) { return !r || (s.titre + " " + s.texte).toLowerCase().indexOf(r) >= 0; });
    return h + '<div class="docs verre">' + (l.length ? l.map(function (s) { return "<details><summary>" + md(s.titre) + '</summary><div class="corps">' + (md(s.texte) || '<span class="vide">(vide)</span>') + "</div></details>"; }).join("") : '<p class="vide" style="padding:8px">Rien ne correspond</p>') +
      '</div><p class="meta" style="margin:12px 4px 0">' + l.length + " entrées</p>";
  }

  function panneau(nom) {
    choisi = nom; var a = A && A.agents.filter(function (x) { return x.nom === nom; })[0], p = $("panneau");
    if (!a) { p.classList.remove("ouvert"); p.setAttribute("aria-hidden", "true"); return; }
    var v = voyant(a), e = a.derniere_erreur ? esc(a.derniere_erreur.action) + " · " + esc(a.derniere_erreur.date) : "aucune", c = a.chiffre_du_jour || {};
    p.innerHTML = '<button class="bouton fermer" id="fermer" aria-label="Fermer"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>' +
      '<h2><i class="pt ' + v[0] + '"></i>' + esc(a.nom) + '</h2><div class="meta" style="margin-top:4px">' + esc(a.pole) + " · " + esc(v[1]) + "</div><p>" + esc(a.role) + "</p>" +
      "<dl><dt>Responsable</dt><dd>" + esc(a.responsable || "—") + "</dd><dt>Horaires</dt><dd>" + esc(a.horaire) + "</dd><dt>Machine</dt><dd>" + esc(a.machine) + "</dd><dt>Sur ce PC</dt><dd>" + (a.tourne_sur_ce_pc ? "tourne" : "ne tourne pas") + (a.planifie_sur_ce_pc ? ", planifié" : "") +
      "</dd><dt>Dernier passage</dt><dd>" + esc(a.dernier_passage || "aucun ici") + "</dd><dt>Dernier résultat</dt><dd>" + esc(a.dernier_resultat || "—") + "</dd><dt>Dernière erreur</dt><dd>" + e + "</dd><dt>" + esc(c.libelle || "Chiffre du jour") + "</dt><dd>" + esc(val(c.valeur)) + "</dd></dl>" +
      '<div class="boutons">' + (a.note_obsidian ? '<a class="bouton" href="' + esc(a.note_obsidian) + '">Ouvrir sa note</a>' : "") + '<button class="bouton" id="voir-journal">Voir son journal</button></div><div class="journal-agent" id="journal-agent" hidden>' +
      ((a.journal || []).slice().reverse().map(function (l) { return '<div><span class="num">' + esc(l[0]) + "</span>" + esc(l[1]) + "</div>"; }).join("") || '<p class="vide">Aucune ligne de journal sur ce PC</p>') + "</div>";
    p.classList.add("ouvert"); p.setAttribute("aria-hidden", "false");
    $("fermer").onclick = function () { panneau(null); rendre(); };
    $("voir-journal").onclick = function () { $("journal-agent").hidden = !$("journal-agent").hidden; };
  }

  function rendre() {
    if (!VUES.some(function (o) { return o[0] === vue; })) vue = "jour";
    if (!DOCS.some(function (d) { return d[0] === doc; })) doc = "a_faire";
    $("nav").innerHTML = VUES.map(function (o) { return '<button data-vue="' + o[0] + '" aria-label="' + o[1] + '"' + (o[0] === vue ? ' aria-current="page"' : "") + ">" + svg(o[0]) + "<span>" + o[1] + "</span></button>"; }).join("");
    $("pied").textContent = V && V.genere_le ? "Données du " + V.genere_le.slice(8, 10) + "/" + V.genere_le.slice(5, 7) + " à " + V.genere_le.slice(11, 16) + ", relues toutes les 5 min" : "";
    var foc = document.activeElement && document.activeElement.id === "recherche", pos = foc ? document.activeElement.selectionStart : 0;
    $("contenu").innerHTML = vue === "agents" ? vueAgents() : vue === "docs" ? vueDocs() : vue === "stats" ? vueStats() : vueJour();
    bulle(null); if (vue === "stats") graphes();
    var s = $("recherche");
    if (s) { s.oninput = function () { recherche = s.value; rendre(); }; if (foc) { s.focus(); s.setSelectionRange(pos, pos); } }
  }
  function appliquer() {
    A = window.JARVIS_AGENTS || null; V = window.JARVIS_VENTES || null; D = window.JARVIS_DOCS || null; H = window.JARVIS_HISTO || null;
    rendre(); if (choisi) panneau(choisi);
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-vue]"); if (b) { vue = b.dataset.vue; memoriser(); rendre(); window.scrollTo(0, 0); return; }
    var d = e.target.closest("[data-doc]"); if (d) { doc = d.dataset.doc; memoriser(); rendre(); return; }
    var q = e.target.closest("[data-periode]"); if (q) { periode = q.dataset.periode; memoriser(); rendre(); return; }
    var c = e.target.closest(".agent, .rang:not(.entete)"); if (c) { panneau(c.dataset.nom); rendre(); }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && choisi) { panneau(null); rendre(); } });
  function recharger() {   // toutes les 5 min : relit agents.js, ventes.js, docs.js et data/historique.js (réécrits par outils\agents-json.py)
    var f = ["agents.js", "ventes.js", "docs.js", "data/historique.js"], n = 0;
    f.forEach(function (x) {
      var s = document.createElement("script"); s.src = x + "?t=" + Date.now();
      s.onload = s.onerror = function () { s.remove(); if (++n === f.length) appliquer(); };
      document.body.appendChild(s);
    });
  }
  appliquer(); setInterval(recharger, 5 * 60 * 1000);
})();
</script>
</body>
